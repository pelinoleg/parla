name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign
        env:
          SIGN_P12_BASE64: ${{ secrets.SIGN_P12_BASE64 }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
        run: |
          echo "$SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          SIGN_P12="$RUNNER_TEMP/sign.p12" VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Parla.zip --title "Parla $GITHUB_REF_NAME" --generate-notes
